<!DOCTYPE html>

<html class="dark" lang="en"><head>

<style>
        .neon-glow {
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }
        .neon-text-glow {
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        .glass-card {
            background: rgba(21, 28, 44, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .input-glow:focus {
            box-shadow: 0 0 0 2px #ffd700, 0 0 15px rgba(255, 215, 0, 0.3);
            border-color: #ffd700;
        }
        /* Custom scrollbar for dark mode */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0d1320;
        }
        ::-webkit-scrollbar-thumb {
            background: #2e3542;
            border-radius: 4px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-lg antialiased overflow-x-hidden pt-24 pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface-dim/80 dark:bg-surface-dim/80 backdrop-blur-xl border-b border-white/10 shadow-xl shadow-primary-container/5">
<div class="flex justify-between items-center px-margin-mobile h-20 w-full">
<div class="flex items-center gap-xs cursor-pointer hover:bg-white/5 transition-colors active:scale-95 duration-100 p-2 rounded-full">
<div class="w-10 h-10 rounded-full overflow-hidden border border-outline/30">
<img class="w-full h-full object-cover" data-alt="A close-up, high-contrast avatar portrait of a modern user in a cyberpunk or neon-lit environment. The lighting is cinematic, with intense gold and deep blue rim lights defining the facial features. The overall mood is intense, focused, and slightly futuristic, fitting a high-stakes digital betting platform." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCcFoy7-w4P806tZKZEczNrMewnG7biSpNMkxH2oAb_1YReA4Jopnd3vKdax_vLiJ12PzZdZbMsQlQeHqthaVeZNRVznhFgZ8y8u5aVZ44aXyiorVQdiJytTnOU6pDabXD9gSc2yL7NfubrR5-i8zTJT93tv5lQPk8Rpu7GV1Khy4402q0A3Li6vegEeQrbLuZUZpl957pqfpZBc8JqxrA9M9jeTHFqzwoxv91qhAttt4cIHpjp13CH"/>
</div>
</div>
<h1 class="font-display-lg text-display-lg font-black text-primary-container tracking-tighter">CADEMO</h1>
<div class="flex items-center">
<button class="px-sm py-xs bg-surface-container rounded-lg border border-outline-variant text-on-surface font-label-bold text-label-bold flex items-center gap-2 hover:bg-white/5 transition-colors active:scale-95 duration-100">
<span class="text-primary-container">€2,000 Goal</span>
</button>
</div>
</div>
</header>
<!-- Main Content -->
<main class="px-margin-mobile flex flex-col gap-lg max-w-2xl mx-auto">
<!-- Ticket Header -->
<div class="flex justify-between items-end mb-sm">
<div>
<h2 class="font-title-md text-title-md text-on-surface">Your Ticket</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">2 Selections</p>
</div>
<button class="text-error font-body-sm text-body-sm flex items-center gap-1 hover:text-error-container transition-colors">
<span class="material-symbols-outlined" style="font-size: 16px;">delete</span>
                Clear All
            </button>
</div>
<!-- Selections List -->
<div class="flex flex-col gap-sm">
<!-- Selection Card 1 -->
<div class="glass-card rounded-xl p-md relative overflow-hidden group">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-primary-container"></div>
<div class="flex justify-between items-start mb-xs">
<div>
<span class="font-label-bold text-label-bold text-on-surface-variant uppercase tracking-wider">Match Winner</span>
<h3 class="font-title-md text-title-md text-on-surface mt-1">Real Madrid</h3>
</div>
<div class="bg-surface-container-lowest px-sm py-xs rounded-lg border border-primary-container/30">
<span class="font-stats-numeric text-title-md text-primary-container neon-text-glow">1.85</span>
</div>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined" style="font-size: 14px;">sports_soccer</span>
                    Real Madrid vs FC Barcelona
                </p>
<button class="absolute top-md right-md text-on-surface-variant hover:text-error transition-colors">
<span class="material-symbols-outlined" style="font-size: 20px;">close</span>
</button>
</div>
<!-- Selection Card 2 -->
<div class="glass-card rounded-xl p-md relative overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-primary-container"></div>
<div class="flex justify-between items-start mb-xs">
<div>
<span class="font-label-bold text-label-bold text-on-surface-variant uppercase tracking-wider">Over/Under 2.5</span>
<h3 class="font-title-md text-title-md text-on-surface mt-1">Over</h3>
</div>
<div class="bg-surface-container-lowest px-sm py-xs rounded-lg border border-primary-container/30">
<span class="font-stats-numeric text-title-md text-primary-container neon-text-glow">2.10</span>
</div>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined" style="font-size: 14px;">sports_soccer</span>
                    Manchester City vs Arsenal
                </p>
<button class="absolute top-md right-md text-on-surface-variant hover:text-error transition-colors">
<span class="material-symbols-outlined" style="font-size: 20px;">close</span>
</button>
</div>
<!-- Add More Button -->
<button class="w-full py-sm rounded-xl border border-dashed border-outline-variant text-on-surface-variant font-body-sm text-body-sm hover:bg-surface-container hover:text-on-surface transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined">add</span>
                Add More Bets
            </button>
</div>
<!-- Stake & Summary Section -->
<div class="bg-surface-container-lowest rounded-xl p-md border border-white/5 mt-sm">
<!-- Quick Stake Buttons -->
<div class="flex gap-xs mb-md overflow-x-auto pb-2 -mx-md px-md md:mx-0 md:px-0 scrollbar-hide">
<button class="flex-none px-lg py-sm rounded-full bg-surface-container border border-outline-variant text-on-surface font-label-bold text-label-bold hover:bg-white/5 transition-colors active:scale-95">€5</button>
<button class="flex-none px-lg py-sm rounded-full bg-surface-container border border-outline-variant text-on-surface font-label-bold text-label-bold hover:bg-white/5 transition-colors active:scale-95">€10</button>
<button class="flex-none px-lg py-sm rounded-full bg-secondary-container/30 border border-secondary text-secondary font-label-bold text-label-bold hover:bg-secondary-container/50 transition-colors active:scale-95">€25</button>
<button class="flex-none px-lg py-sm rounded-full bg-surface-container border border-outline-variant text-on-surface font-label-bold text-label-bold hover:bg-white/5 transition-colors active:scale-95">€50</button>
<button class="flex-none px-lg py-sm rounded-full bg-surface-container border border-outline-variant text-on-surface font-label-bold text-label-bold hover:bg-white/5 transition-colors active:scale-95">MAX</button>
</div>
<!-- Custom Stake Input -->
<div class="relative mb-lg">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="text-on-surface-variant font-title-md text-title-md">€</span>
</div>
<input class="w-full bg-[#070B14] border border-outline-variant rounded-xl py-md pl-12 pr-md text-right font-stats-numeric text-stats-numeric text-on-surface focus:outline-none input-glow transition-all" placeholder="0.00" type="number" value="25"/>
</div>
<!-- Summary Details -->
<div class="flex flex-col gap-xs pt-sm border-t border-white/10">
<div class="flex justify-between items-center">
<span class="font-body-sm text-body-sm text-on-surface-variant">Total Odds</span>
<span class="font-title-md text-title-md text-on-surface">3.88</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-sm text-body-sm text-on-surface-variant">Potential Winnings</span>
<span class="font-stats-numeric text-stats-numeric text-tertiary-fixed-dim drop-shadow-[0_0_8px_rgba(78,222,163,0.3)]">€97.00</span>
</div>
</div>
<!-- Balance Warning/Info -->
<div class="mt-md text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">Balance after bet: <span class="text-on-surface">€145.50</span></p>
</div>
</div>
<!-- Validate Button -->
<button class="w-full bg-primary-container text-on-primary-container font-headline-lg-mobile text-headline-lg-mobile py-md rounded-xl mt-sm neon-glow hover:bg-primary-fixed transition-all active:scale-[0.98] flex items-center justify-center gap-2">
            Validate Bet
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-xl bg-surface-container-lowest/90 dark:bg-surface-container-lowest/90 backdrop-blur-2xl shadow-[0_-8px_30px_rgb(0,0,0,0.5)] border-t border-white/5 md:hidden">
<div class="flex justify-around items-center h-20 pb-safe w-full">
<button class="flex flex-col items-center justify-center text-on-surface-variant/70 hover:text-primary-fixed active:scale-90 transition-transform duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">sports_soccer</span>
<span class="font-label-bold text-label-bold mt-1">Paris</span>
</button>
<button class="flex flex-col items-center justify-center bg-secondary-container/40 text-primary-container rounded-xl px-3 py-1 shadow-[0_0_15px_rgba(255,215,0,0.2)] hover:text-primary-fixed active:scale-90 transition-transform duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">confirmation_number</span>
<span class="font-label-bold text-label-bold mt-1">Ticket</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant/70 hover:text-primary-fixed active:scale-90 transition-transform duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">history</span>
<span class="font-label-bold text-label-bold mt-1">Mes Paris</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant/70 hover:text-primary-fixed active:scale-90 transition-transform duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">person</span>
<span class="font-label-bold text-label-bold mt-1">Profil</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant/70 hover:text-primary-fixed active:scale-90 transition-transform duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">shield_person</span>
<span class="font-label-bold text-label-bold mt-1">Admin</span>
</button>
</div>
</nav>
</body></html>
