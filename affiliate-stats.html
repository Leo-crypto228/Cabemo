<!DOCTYPE html>
<html class="dark" lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stats — Cademo Affiliate</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>tailwind.config={darkMode:"class",theme:{extend:{colors:{surface:"#0b1323",background:"#0b1323","surface-container":"#182030","surface-container-high":"#222a3b","surface-variant":"#2d3546",primary:"#b7c4ff","primary-container":"#1d4ed8","on-primary":"#002682","on-surface":"#dbe2f9","on-surface-variant":"#c4c5d7",secondary:"#ffe083","secondary-container":"#eec200",tertiary:"#4ae176","tertiary-container":"#006b2d","on-tertiary":"#003915",outline:"#8e90a0",error:"#ffb4ab","error-container":"#93000a"},fontFamily:{sans:["Hanken Grotesk","sans-serif"]},fontSize:{xs:["11px","14px"],sm:["12px","16px"],base:["14px","18px"],lg:["16px","20px"],xl:["18px","24px"],"2xl":["22px","28px"],"3xl":["28px","36px"]},borderRadius:{DEFAULT:"0.5rem",lg:"0.75rem",xl:"1rem",full:"9999px"}}}}</script>
<style>
body{font-family:'Hanken Grotesk',sans-serif;background:#0b1323;color:#dbe2f9;min-height:100dvh;-webkit-tap-highlight-color:transparent}
.material-symbols-outlined{font-variation-settings:'wght' 500}
input,button{-webkit-appearance:none;font-family:inherit}
</style>
</head>
<body class="pb-20">

<header class="sticky top-0 z-40 bg-surface/95 backdrop-blur border-b border-white/10">
  <div class="max-w-md mx-auto px-4 h-14 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="material-symbols-outlined text-primary text-xl">workspace_premium</span>
      <span class="font-bold text-lg text-on-surface">Cademo<span class="text-primary"> Affiliate</span></span>
    </div>
    <button id="btnLogout" class="text-xs font-semibold text-on-surface-variant hover:text-error transition-colors flex items-center gap-1">
      <span class="material-symbols-outlined text-base">logout</span> Déconnexion
    </button>
  </div>
</header>

<main class="max-w-md mx-auto px-4 pt-5 space-y-5">

  <!-- Stats Grid -->
  <div class="grid grid-cols-3 gap-3">
    <div class="bg-surface-container border border-white/10 rounded-xl p-3 text-center">
      <div id="statEarnings" class="text-xl font-bold text-primary">0 Û</div>
      <div class="text-[10px] uppercase font-bold text-on-surface-variant mt-1">Gagnés</div>
    </div>
    <div class="bg-surface-container border border-white/10 rounded-xl p-3 text-center">
      <div id="statTotal" class="text-xl font-bold text-on-surface">0</div>
      <div class="text-[10px] uppercase font-bold text-on-surface-variant mt-1">Total</div>
    </div>
    <div class="bg-surface-container border border-white/10 rounded-xl p-3 text-center">
      <div id="statVerified" class="text-xl font-bold text-tertiary">0</div>
      <div class="text-[10px] uppercase font-bold text-on-surface-variant mt-1">Validés</div>
    </div>
  </div>

  <!-- Objectif Prime -->
  <section class="bg-surface-container border border-white/10 rounded-xl p-4">
    <div class="flex justify-between items-center mb-3">
      <h2 class="font-bold text-sm text-on-surface flex items-center gap-2"><span class="material-symbols-outlined text-secondary">trophy</span> Objectif : Prime 50 Û</h2>
      <span id="tierLabel" class="text-[11px] font-bold bg-surface-variant text-on-surface-variant px-2 py-1 rounded-md">0 / 30</span>
    </div>
    <div class="w-full h-2 bg-surface-variant rounded-full overflow-hidden mb-2">
      <div id="tierBar" class="h-full bg-primary rounded-full transition-all duration-500" style="width:0%"></div>
    </div>
    <p id="tierText" class="text-xs text-on-surface-variant">Plus que <strong class="text-primary">30 comptes validés</strong> pour débloquer ta prime.</p>
  </section>

  <!-- Registre -->
  <section>
    <h3 class="font-bold text-sm uppercase tracking-wider text-on-surface-variant mb-3 flex items-center gap-2">
      <span class="material-symbols-outlined text-base">group</span> Registre des joueurs
    </h3>
    <div id="referralList" class="space-y-2">
      <div class="bg-surface-container/50 border border-white/5 rounded-xl p-4 text-center text-sm text-on-surface-variant">Chargement...</div>
    </div>
  </section>

</main>

<nav class="fixed bottom-0 left-0 w-full bg-surface-container border-t border-white/10 z-50">
  <div class="max-w-md mx-auto flex justify-around items-center px-4 py-2">
    <button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 gap-0.5" onclick="location.href='affiliate-bonus.html'">
      <span class="material-symbols-outlined text-xl">card_giftcard</span>
      <span class="text-[11px] font-bold">Bonus</span>
    </button>
    <button class="flex flex-col items-center justify-center text-on-surface px-4 py-1 gap-0.5" onclick="location.href='affiliate-stats.html'">
      <span class="material-symbols-outlined text-xl" style="font-variation-settings:'FILL' 1">query_stats</span>
      <span class="text-[11px] font-bold">Stats</span>
    </button>
  </div>
</nav>

<script>
(()=>{
const token=localStorage.getItem('cademo_affiliate_token');
if(!token){location.href='affiliate-login.html';return;}
const el=id=>document.getElementById(id);

el('btnLogout').addEventListener('click',()=>{
  ['cademo_affiliate_token','cademo_affiliate_refresh','cademo_affiliate_profile'].forEach(k=>localStorage.removeItem(k));
  location.href='affiliate-login.html';
});

async function api(path){
  const r=await fetch('/api'+path,{headers:{'Authorization':'Bearer '+token}});
  return r.json();
}

(async function init(){
  const [sRes,rRes]=await Promise.all([api('/affiliate/stats'),api('/affiliate/referrals')]);
  if(!sRes.success){alert('Erreur chargement stats');return;}
  const st=sRes.stats;
  el('statEarnings').textContent=(st.totalEarnings||0)+' Û';
  el('statTotal').textContent=st.totalReferrals||0;
  el('statVerified').textContent=st.verifiedReferrals||0;
  const progress=st.nextTierProgress||0;
  const target=st.nextTierTarget||30;
  const remaining=Math.max(0,target-progress);
  el('tierLabel').textContent=progress+' / '+target+' Validés';
  el('tierBar').style.width=Math.round((progress/target)*100)+'%';
  el('tierText').innerHTML='Plus que <strong class="text-primary">'+remaining+' compte'+(remaining>1?'s':'')+' validé'+(remaining>1?'s':'')+'</strong> pour déblocher ta prime.';

  const list=el('referralList'); list.innerHTML='';
  const refs=(rRes.success?rRes.referrals:[]);
  if(!refs.length){
    list.innerHTML='<div class="bg-surface-container/50 border border-white/5 rounded-xl p-4 text-center text-sm text-on-surface-variant">Aucun joueur enregistré pour le moment.</div>';
  }else{
    refs.forEach(p=>{
      const validated=p.status==='bonus_activated';
      const badge=validated
        ?'<div class="flex items-center gap-1 text-tertiary text-xs font-bold"><span class="material-symbols-outlined text-sm" style="font-variation-settings:''FILL'' 1">check_circle</span> Validé</div>'
        :'<div class="flex items-center gap-1 text-secondary text-xs font-bold"><span class="material-symbols-outlined text-sm" style="font-variation-settings:''FILL'' 1">schedule</span> En attente</div>';
      const bonus=validated?'<span class="font-bold text-tertiary ml-2 text-xs">+50Û</span>':'';
      const row=document.createElement('div');
      row.className='bg-surface-container border border-white/10 rounded-xl p-3 flex items-center justify-between';
      row.innerHTML='<div class="flex items-center gap-2"><span class="font-mono font-bold text-sm text-on-surface">#'+p.playerShortId+'</span>'+bonus+'</div>'+badge;
      list.appendChild(row);
    });
  }
})();
})();
</script>
</body></html>
