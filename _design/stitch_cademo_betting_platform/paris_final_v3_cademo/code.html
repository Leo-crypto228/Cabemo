<body class="bg-background text-on-surface h-screen flex flex-col overflow-hidden pb-[72px]">

<div class="flex items-center gap-space-sm"><button class="bg-error-container text-on-error-container border border-error px-4 py-1.5 rounded-full flex items-center gap-2 hover:scale-105 transition-transform shadow-md"><span class="material-symbols-outlined text-[18px]">lock</span><span class="font-label-bold text-label-bold uppercase tracking-wide">DÉBLOQUE 200$</span></button></div>
</header>
<main class="flex-1 overflow-y-auto w-full max-w-[600px] mx-auto flex flex-col">

<div class="flex space-x-space-lg overflow-x-auto hide-scrollbar items-center"><button class="flex flex-col items-center gap-1 min-w-max text-primary border-b-2 border-primary pb-1"><span class="font-body-md text-body-md font-bold">Formule 1</span></button><button class="flex flex-col items-center gap-1 min-w-max text-on-surface-variant hover:text-on-surface transition-colors"><span class="font-body-md text-body-md">Basket</span></button><button class="flex flex-col items-center gap-1 min-w-max text-on-surface-variant hover:text-on-surface transition-colors"><span class="font-body-md text-body-md">Football</span></button></div>

<div class="px-container-margin pb-space-md shrink-0">

<button class="bg-primary-container text-on-primary-container px-4 py-1.5 rounded-full font-body-md text-body-md whitespace-nowrap border border-primary-container">
